name: Build Awk BK

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: awk-bk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            zip: AwkBK-windows.zip
          - os: macos-latest
            name: macos
            zip: AwkBK-macos.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "Awk BK.vst3" | Select-Object -First 1
          if (-not $vst) { throw "Windows VST3 bundle was not produced" }
          Write-Host "Packaging $($vst.FullName)"
          if (Test-Path AwkBK-windows.zip) { Remove-Item AwkBK-windows.zip }
          Compress-Archive -Path $vst.FullName -DestinationPath AwkBK-windows.zip
          Get-Item AwkBK-windows.zip | Format-List Name, Length

      - name: Package macOS VST3
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VST=$(find build -type d -name "Awk BK.vst3" | head -n 1)
          test -n "$VST"
          echo "Packaging $VST"
          ditto -c -k --keepParent "$VST" AwkBK-macos.zip
          ls -lh AwkBK-macos.zip
          unzip -l AwkBK-macos.zip | head -n 40

      - name: Upload VST3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AwkBK-${{ matrix.name }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build zips
        uses: actions/download-artifact@v4
        with:
          pattern: AwkBK-*
          path: dist
          merge-multiple: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find dist -type f -name '*.zip' -print
          windows=$(find dist -type f -name 'AwkBK-windows.zip' | head -n 1)
          macos=$(find dist -type f -name 'AwkBK-macos.zip' | head -n 1)
          test -n "$windows"
          test -n "$macos"
          test -f RELEASE_NOTES.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$windows" "$macos" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$windows" "$macos" \
              --title "Awk BK ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
